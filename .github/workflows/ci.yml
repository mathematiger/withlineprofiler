name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.3"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry env use "${{ steps.setup.outputs.python-path }}"
      - run: poetry install --with dev,test --extras resources
      - run: poetry run ruff check lineprofiler tests with_line_profiler.py
      - run: poetry run mypy lineprofiler tests with_line_profiler.py

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      # poetry is installed by pipx against the runner's own interpreter, so left to itself it
      # can build the venv for that Python rather than the matrix one -- a leg then reports
      # green while testing the wrong version. A 3.12-only f-string shipped through "py3.10"
      # and "py3.11" this way. Pin the venv, then refuse to run if it is still not the leg's
      # Python, so the next drift fails loudly instead of silently passing.
      #
      # `env use` does not do it on its own. Poetry builds the venv with the interpreter *it*
      # runs on whatever path it is handed: the py3.11 leg produced a venv correctly named
      # py3.11 whose base executable was /usr/bin/python3.12 -- the Python pipx first
      # installed poetry with. Put poetry on the matrix interpreter, now that setup-python
      # has provided it, so the venv it builds is this leg's. The first install above has to
      # stay: setup-python's `cache: poetry` runs `poetry config` before this point.
      # Uninstall first rather than `install --force`: pipx ignores --python when --force is
      # passed, says so on stdout, and installs on the old interpreter anyway with a zero
      # exit code. The guard below is what caught that.
      - run: |
          pipx uninstall poetry
          pipx install poetry==${{ env.POETRY_VERSION }} \
            --python "${{ steps.setup.outputs.python-path }}"
          poetry --version
      # A venv restored from the cache is still one built during the drift, under the name
      # this leg's Python would be given, and poetry adopts an existing directory by name
      # without checking the interpreter inside it. The cache key is the Python version plus
      # the lock hash, so fixing the workflow does not change it and the wrong venv is
      # restored for as long as it lives. Rebuild when it does not match, which self-heals
      # the caches already poisoned and is a no-op once they are clean.
      - name: Use the matrix Python, rebuilding a cached venv that is not it
        run: |
          marker="import sys; print('%d.%d' % sys.version_info[:2])"
          poetry env use "${{ steps.setup.outputs.python-path }}"
          if [ "$(poetry run python -c "$marker" || true)" != "${{ matrix.python }}" ]; then
            poetry env remove --all
            poetry env use "${{ steps.setup.outputs.python-path }}"
          fi
      # psutil is installed on purpose: without it the I/O and memory paths degrade to
      # their absent-capability branches and the suite silently stops testing them.
      - run: poetry install --with dev,test --extras resources
      # Prints what it found before comparing. A bare `grep -q` here failed three legs while
      # showing nothing of the interpreter it objected to, which is the same defect this
      # package's own reports are written to avoid: state the measurement, not just the verdict.
      - name: The venv really is ${{ matrix.python }}
        run: |
          poetry env info
          found="$(poetry run python -c "import sys; print('%d.%d' % sys.version_info[:2])")"
          echo "poetry run python reports ${found}, this leg wants ${{ matrix.python }}"
          test "$found" = "${{ matrix.python }}"
      - run: poetry run pytest tests/ -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry env use "${{ steps.setup.outputs.python-path }}"
      - run: poetry install --with dev,test --extras resources
      - run: poetry run pytest tests/ --cov=lineprofiler --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  overhead:
    name: hot-path overhead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry env use "${{ steps.setup.outputs.python-path }}"
      - run: poetry install --with dev,test --extras resources
      # The whole value proposition is a ns/call number; without this a 10x regression in
      # _PhaseScope would merge unnoticed. Bounds are deliberately loose — a shared runner is
      # noisy — so this catches order-of-magnitude regressions, not percentages.
      # -m overhead opts back in: the default addopts deselect it everywhere else.
      - run: poetry run pytest tests/test_overhead.py -q -m overhead

  build:
    name: build + install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry build
      # A packaged sdist that cannot be tested is a packaging bug for Spack and EasyBuild,
      # so the sdist ships tests and this proves they run from it.
      - name: pytest from the sdist
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          python -m pip install --upgrade pip
          python -m pip install ".[resources]" pytest
          python -m pytest tests/ -q
