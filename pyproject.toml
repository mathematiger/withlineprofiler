[project]
name = "with_line_profiler"
version = "0.8.4"
description = "Line-by-line profiling, plus a low-overhead accounting layer for long multi-process RL training runs. Installed as with-line-profiler, imported as lineprofiler."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "mathematiger", email = "mcop.dkoehler@gmail.com" },
]
keywords = [
    "profiler",
    "profiling",
    "line-profiler",
    "tracing",
    "performance",
    "timing",
    "debugging",
    "jupyter",
    "reinforcement-learning",
    "multiprocessing",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# tomllib entered the stdlib in 3.11; on 3.10 the config reader needs its backport. This is
# the only required dependency and it disappears on every version above 3.10, so the
# zero-dependency property holds everywhere it can.
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

# Every extra is optional at runtime: the code imports each lazily behind a capability
# check, and a missing one disables one block of the report instead of raising.
[project.optional-dependencies]
resources = ["psutil>=5.9"]          # RSS and per-process I/O counters
gpu = ["nvidia-ml-py>=12.0"]         # sampled GPU utilisation
viztracer = ["viztracer>=0.16"]      # the viztracer backend
all = ["psutil>=5.9", "nvidia-ml-py>=12.0", "viztracer>=0.16"]

[project.scripts]
lineprofiler = "lineprofiler.accounting.cli:main"

[project.urls]
Homepage = "https://github.com/mathematiger/withlineprofiler"
Repository = "https://github.com/mathematiger/withlineprofiler"
Issues = "https://github.com/mathematiger/withlineprofiler/issues"
Changelog = "https://github.com/mathematiger/withlineprofiler/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [
    { include = "lineprofiler" },
    # The pip name as an importable module, so `import with_line_profiler` works too. It
    # re-exports lineprofiler and holds nothing of its own.
    { include = "with_line_profiler.py", format = ["sdist", "wheel"] },
]
include = [
    { path = "lineprofiler/py.typed", format = ["sdist", "wheel"] },
    # Tests ship in the sdist so a downstream packager (Spack, EasyBuild, a distro) can
    # validate the build they are about to install. They stay out of the wheel.
    { path = "tests", format = "sdist" },
    { path = "benchmarks", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    # The README links out to these, so a downstream packager building from the sdist would
    # otherwise ship documentation whose every link is dead.
    { path = "docs", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.5"
mypy = "^1.10"

[tool.poetry.group.test.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Overhead assertions are timing-sensitive and meaningless on a loaded machine; CI runs them
# as their own job. Locally: pytest -m overhead
markers = ["overhead: hot-path cost assertions, sensitive to machine load"]

[tool.coverage.run]
branch = true
source = ["lineprofiler"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Optional integrations. These are imported lazily behind capability checks and are not
# installed in the dev environment, so their absence must not fail the type check.
#
# `tomli` is here for a different reason: it is a real dependency, but only on 3.10, where
# `tomllib` is not yet in the stdlib. The dev environment is 3.12, so the backport is
# correctly absent and mypy would otherwise fail on a branch that never runs here.
[[tool.mypy.overrides]]
module = ["torch.*", "pynvml.*", "viztracer.*", "psutil.*", "nvtx.*", "tomli"]
ignore_missing_imports = true
