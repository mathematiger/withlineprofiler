[project]
name = "with_line_profiler"
version = "0.4.0"
description = "Line-by-line profiling, plus a low-overhead accounting layer for long multi-process RL training runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "mathematiger", email = "mcop.dkoehler@gmail.com" },
]
keywords = [
    "profiler",
    "profiling",
    "performance",
    "timing",
    "debugging",
    "reinforcement-learning",
    "multiprocessing",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

# Every extra is optional at runtime: the code imports each lazily behind a capability
# check, and a missing one disables one block of the report instead of raising.
[project.optional-dependencies]
resources = ["psutil>=5.9"]          # RSS and per-process I/O counters
gpu = ["nvidia-ml-py>=12.0"]         # sampled GPU utilisation
viztracer = ["viztracer>=0.16"]      # the viztracer backend
all = ["psutil>=5.9", "nvidia-ml-py>=12.0", "viztracer>=0.16"]

[project.scripts]
lineprofiler = "lineprofiler.accounting.cli:main"

[project.urls]
Homepage = "https://github.com/mathematiger/withlineprofiler"
Repository = "https://github.com/mathematiger/withlineprofiler"
Issues = "https://github.com/mathematiger/withlineprofiler/issues"
Changelog = "https://github.com/mathematiger/withlineprofiler/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lineprofiler" }]
include = [
    { path = "lineprofiler/py.typed", format = ["sdist", "wheel"] },
    # Tests ship in the sdist so a downstream packager (Spack, EasyBuild, a distro) can
    # validate the build they are about to install. They stay out of the wheel.
    { path = "tests", format = "sdist" },
    { path = "benchmarks", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.5"
mypy = "^1.10"

[tool.poetry.group.test.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Overhead assertions are timing-sensitive and meaningless on a loaded machine; CI runs them
# as their own job. Locally: pytest -m overhead
markers = ["overhead: hot-path cost assertions, sensitive to machine load"]

[tool.coverage.run]
branch = true
source = ["lineprofiler"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Optional integrations. These are imported lazily behind capability checks and are not
# installed in the dev environment, so their absence must not fail the type check.
[[tool.mypy.overrides]]
module = ["torch.*", "pynvml.*", "viztracer.*", "psutil.*", "nvtx.*"]
ignore_missing_imports = true
